# .github/workflows/ci.yml
# Control Center — test suite
#
# Until this existed, nothing ran the tests on push: the only workflow was
# release.yml, triggered on a tag, which built and published without executing any
# of them. That matters more here than in most projects, because the properties the
# suite guards fail silently by construction — a truncated recording, a coordinate
# that was never read, a keystroke that never landed all report success. The tests
# are the only thing standing between those and a shipped release.

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']      # tagged builds run these same checks inside release.yml
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust + Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        # The integration suite drives a real agent against a virtual display.
        # xvfb + xdotool are the actuation backend; tk backs the probe windows that
        # read typed text and key events back out of a focused widget.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool python3-tk protobuf-compiler libssl-dev pkg-config

      - name: Install Python dependencies
        # Listed explicitly rather than via `pip install .`: crates/controller has no
        # top-level __init__.py, so find_packages() resolves to nothing and installing
        # the project would install no package at all. tests/conftest.py puts
        # crates/ on sys.path instead.
        # psutil is a hard dependency — integrations/__init__.py imports export, which
        # imports it at module level, so omitting it breaks every import of the gRPC
        # client. PyJWT and PyYAML back lazily-imported CLI paths; installed so a
        # runner reflects a complete install rather than a partial one.
        run: |
          python -m pip install --upgrade pip
          pip install grpcio grpcio-tools protobuf click requests cryptography \
                      keyring psutil PyJWT PyYAML pytest

      - name: Generate protobuf modules
        # Same generation release.yml performs, so CI tests the current .proto rather
        # than whatever happened to be committed.
        run: python scripts/generate_proto.py

      - name: Build workspace
        # Debug binaries are a prerequisite for the integration suite, not just a
        # compile check: tests/integration/harness.py launches target/debug/
        # control-center-{server,agent} and generate-token.
        run: cargo build --workspace

      - name: Check test preconditions
        # Every one of these makes the suite *skip* rather than fail, and
        # green-because-skipped is the exact failure this job exists to prevent.
        # Checked directly instead of grepping pytest output for skips: several
        # tests skip legitimately, because the two display regimes they cover
        # (a warp that lands vs one that silently no-ops) are mutually exclusive.
        run: |
          set -e
          for b in control-center-server control-center-agent generate-token; do
            test -x "target/debug/$b" || { echo "::error::missing target/debug/$b"; exit 1; }
          done
          command -v Xvfb   >/dev/null || { echo "::error::Xvfb not installed";   exit 1; }
          command -v xdotool >/dev/null || { echo "::error::xdotool not installed"; exit 1; }
          python -c "import tkinter" || { echo "::error::tkinter not installed"; exit 1; }
          # An undeclared dependency surfaces as a collection error in every test module
          # at once, which reads as a broken suite rather than a missing package. Import
          # the controller here so the cause is named where it happens.
          PYTHONPATH=crates python -c "
          import controller.integrations.gRPC, controller.management.cli
          import controller.os_specific.linux_actuation
          " || { echo "::error::controller package failed to import — missing dependency?"; exit 1; }

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace

      - name: Python tests
        run: python -m pytest tests/ -q -rs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/pytest-of-*/**/logs/*.log
          if-no-files-found: ignore
