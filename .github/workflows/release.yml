# .github/workflows/release.yml
# Control Center - Release Workflow

name: Release Control Center

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 0: TEST GATE
  # ============================================================================
  # Every build job depends on this, so a tag cannot publish binaries that were
  # never tested. ci.yml runs the same checks on push but skips tags, which is why
  # the gate is repeated here rather than assumed.
  test:
    name: Test suite (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool python3-tk protobuf-compiler libssl-dev pkg-config

      - name: Install Python dependencies
        # Must stay in step with the build jobs below, which have always installed
        # psutil/pyjwt/pyyaml: psutil is imported at module level by
        # integrations/export.py, so without it every test module fails to collect.
        run: |
          python -m pip install --upgrade pip
          pip install grpcio grpcio-tools protobuf click requests cryptography \
                      keyring psutil PyJWT PyYAML pytest

      - name: Generate Protobuf Files
        # Shared script rather than inlined protoc: it also rewrites the generated
        # stub's bare `import control_center_pb2` into a package-relative import,
        # and six copies of that inline would drift.
        run: python scripts/generate_proto.py

      - name: Build workspace (debug binaries drive the integration harness)
        run: cargo build --workspace

      - name: Check test preconditions
        run: |
          set -e
          for b in control-center-server control-center-agent generate-token; do
            test -x "target/debug/$b" || { echo "::error::missing target/debug/$b"; exit 1; }
          done
          command -v Xvfb   >/dev/null || { echo "::error::Xvfb not installed";   exit 1; }
          command -v xdotool >/dev/null || { echo "::error::xdotool not installed"; exit 1; }
          python -c "import tkinter" || { echo "::error::tkinter not installed"; exit 1; }
          PYTHONPATH=crates python -c "
          import controller.integrations.gRPC, controller.management.cli
          import controller.os_specific.linux_actuation
          " || { echo "::error::controller package failed to import — missing dependency?"; exit 1; }

      - name: Rust tests
        run: cargo test --workspace

      - name: Python tests
        run: python -m pytest tests/ -q -rs

  # ============================================================================
  # JOB 1: LINUX BUILD (x64)
  # ============================================================================
  build-linux-x64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Build Rust Binaries
        run: cargo build --release --workspace

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio grpcio-tools protobuf pyyaml requests psutil pyjwt cryptography keyring

      - name: Generate Protobuf Files
        # Shared script rather than inlined protoc: it also rewrites the generated
        # stub's bare `import control_center_pb2` into a package-relative import,
        # and six copies of that inline would drift.
        run: python scripts/generate_proto.py

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile \
            --name control-center \
            --paths crates \
            --add-data "crates/controller:controller" \
            --add-data "crates/controller/integrations/proto:controller/integrations/proto" \
            --hidden-import=click \
            --hidden-import=grpc \
            --hidden-import=grpc._cython.cygrpc \
            --hidden-import=yaml \
            --hidden-import=psutil \
            --hidden-import=google.protobuf \
            --hidden-import=readline \
            --hidden-import=cryptography \
            --hidden-import=keyring \
            --hidden-import=keyring.backends \
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        run: |
          mkdir -p package/bin
          
          cp target/release/control-center-server package/bin/
          cp target/release/control-center-agent package/bin/
          cp target/release/generate-token package/bin/
          cp dist/control-center package/bin/
          chmod +x package/bin/*
          
          cat > package/install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "  Control Center v${{ steps.version.outputs.VERSION }}"
          echo "=========================================="
          echo ""
          
          echo "[1/2] Installing Rust binaries..."
          mkdir -p "$HOME/.local/bin"
          cp bin/control-center-server "$HOME/.local/bin/"
          cp bin/control-center-agent "$HOME/.local/bin/"
          cp bin/generate-token "$HOME/.local/bin/"
          cp bin/control-center "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/control-center-server"
          chmod +x "$HOME/.local/bin/control-center-agent"
          chmod +x "$HOME/.local/bin/generate-token"
          chmod +x "$HOME/.local/bin/control-center"
          echo "  ✓ Server:          $HOME/.local/bin/control-center-server"
          echo "  ✓ Agent:           $HOME/.local/bin/control-center-agent"
          echo "  ✓ Token generator: $HOME/.local/bin/generate-token"
          echo "  ✓ CLI:             $HOME/.local/bin/control-center"
          echo ""
          
          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
              echo "⚠ Add to your PATH:"
              echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
              echo ""
              echo "  Add this to your ~/.bashrc or ~/.zshrc"
          fi
          
          echo "=========================================="
          echo "✓ Installation complete!"
          echo "=========================================="
          echo ""
          echo "Usage:"
          echo "  export JWT_SECRET=\"your-secret-32-chars-minimum\""
          echo "  generate-token admin"
          echo "  control-center server start"
          echo "  control-center agent start"
          echo "  control-center connect --host X --token Y"
          echo "  control-center --help"
          echo ""
          EOF
          chmod +x package/install.sh
          
          cd package
          tar -czvf ../control-center-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-assets
          path: control-center-*.tar.gz

  # ============================================================================
