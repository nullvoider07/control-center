  # ============================================================================
  # JOB 5: WINDOWS BUILD (x64)
  # ============================================================================
  build-windows-x64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Protobuf
        run: choco install protoc

      - name: Build Rust Binaries
        run: cargo build --release --workspace

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio grpcio-tools protobuf pyyaml requests psutil pyjwt cryptography keyring

      - name: Generate Protobuf Files
        shell: bash
        # Shared script rather than inlined protoc: it also rewrites the generated
        # stub's bare `import control_center_pb2` into a package-relative import,
        # and six copies of that inline would drift.
        run: python scripts/generate_proto.py

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile `
            --name control-center `
            --paths crates `
            --add-data "crates/controller;controller" `
            --add-data "crates/controller/integrations/proto;controller/integrations/proto" `
            --hidden-import=click `
            --hidden-import=grpc `
            --hidden-import=grpc._cython.cygrpc `
            --hidden-import=yaml `
            --hidden-import=psutil `
            --hidden-import=google.protobuf `
            --hidden-import=cryptography `
            --hidden-import=keyring `
            --hidden-import=keyring.backends `
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\bin
          
          Copy-Item target\release\control-center-server.exe package\bin\
          Copy-Item target\release\control-center-agent.exe package\bin\
          Copy-Item target\release\generate-token.exe package\bin\
          Copy-Item dist\control-center.exe package\bin\
          
          # Create installation script
          @'
          @echo off
          echo ==========================================
          echo   Control Center v${{ steps.version.outputs.VERSION }} (Windows x64)
          echo ==========================================
          echo.
          
          echo [1/2] Installing Rust binaries...
          if not exist "%LOCALAPPDATA%\Programs\ControlCenter" mkdir "%LOCALAPPDATA%\Programs\ControlCenter"
          copy /Y bin\control-center-server.exe "%LOCALAPPDATA%\Programs\ControlCenter\"
          copy /Y bin\control-center-agent.exe "%LOCALAPPDATA%\Programs\ControlCenter\"
          copy /Y bin\generate-token.exe "%LOCALAPPDATA%\Programs\ControlCenter\"
          echo   + Server:          %LOCALAPPDATA%\Programs\ControlCenter\control-center-server.exe
          echo   + Agent:           %LOCALAPPDATA%\Programs\ControlCenter\control-center-agent.exe
          echo   + Token generator: %LOCALAPPDATA%\Programs\ControlCenter\generate-token.exe
          echo.
          
          echo [2/2] Installing CLI...
          copy /Y bin\control-center.exe "%LOCALAPPDATA%\Programs\ControlCenter\"
          echo   + CLI: %LOCALAPPDATA%\Programs\ControlCenter\control-center.exe
          echo.
          
          echo ==========================================
          echo Installation complete!
          echo ==========================================
          echo.
          echo Add to PATH:
          echo   %LOCALAPPDATA%\Programs\ControlCenter
          echo.
          echo Usage:
          echo   set JWT_SECRET=your-secret-32-chars-minimum
          echo   generate-token admin
          echo   control-center server start
          echo   control-center agent start
          echo   control-center connect --host X --token Y
          echo.
          pause
          '@ | Out-File -FilePath package\install.bat -Encoding ASCII
          
          Compress-Archive -Path package\* -DestinationPath control-center-${{ steps.version.outputs.VERSION }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-assets
          path: control-center-*.zip

  # ============================================================================
  # JOB 6: CREATE GITHUB RELEASE
  # ============================================================================
  release:
    needs: 
      - build-linux-x64
      - build-linux-arm64
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Control Center ${{ github.ref_name }}

            **Unified package: Rust binaries + Python CLI in one download**

            ## ✨ What's New in v1.2.0

            Reporting fidelity and held-button safety:

            - **Fixed** — A mouse command's reported coordinate could disagree with
              the coordinate requested, while the action itself landed correctly. The
              agent read the cursor back and reported whatever it got as
              authoritative, so a read that raced the synthetic event — or a warp that
              silently did nothing — was published as the result. That value is not
              only echoed to the operator: it is the same field the server stores as
              `mouse_x`/`mouse_y`, so a wrong read was simultaneously a bad
              step-gating signal and corrupt recorded data. The readback is now
              compared against the coordinate the command asked for, re-read a bounded
              number of times, and reported as `position_captured: false` rather than
              emitted unverified.
            - **Added** — The agent tracks mouse buttons left down by `<x> <y> hold`.
              Outstanding holds are reported on every subsequent command and on
              `position`, the console warns once a button has been down more than a
              few seconds, and the agent releases tracked buttons when it exits. An
              unmatched hold previously left the button physically down with no
              indication, turning every later click or move into a drag-select.
            - **Fixed** — The agent now shuts down cleanly on `SIGTERM` as well as
              `SIGINT`. Previously the normal stop signal killed the process outright,
              skipping cleanup.
            - **Fixed** — `<x> <y> hold` and `<x> <y> release` now work on Linux; they
              had only ever been accepted in their `here` form there, while macOS
              accepted both.

            > ⚠️ Consumers of the command stream must read `position_captured` before
            > `mouse_x`/`mouse_y`. An uncaptured position is carried as `(0, 0)`,
            > which is itself a valid screen coordinate.

            ## ✨ Previously in v1.1.1

            Actuation and recording fidelity:

            - **Fixed** — Recorded steps no longer truncate at the first quote. A
              `type` command containing double quotes actuated correctly but every
              stored record stopped at the first escaped quote, because the agent
              re-derived the display string from the escaped shell command. The
              structured-argv rework removed that derivation; the controller now
              supplies the recorded text directly and a regression test asserts on
              the stored record rather than the console echo.
            - **Fixed** — macOS shift+digit and shift+punctuation shortcuts
              (⇧⌘3/⇧⌘4/⇧⌘5) reported success and did nothing. They were sent as typed
              characters rather than keycodes with modifier flags, which system
              hotkeys cannot match. Modified digits and punctuation now go through an
              AppleScript `key code`. Letter shortcuts are unchanged.
            - **Fixed** — Linux punctuation shortcuts (Ctrl+Minus, Ctrl+Comma,
              Ctrl+Slash, Ctrl+`[`/`]`) never worked: the raw character was passed to
              `xdotool`, which either refused the sequence or dropped the target
              silently while still exiting 0. They are now translated to X keysym
              names, and the agent treats a dropped key as a failed command instead of
              a success.
            - **Fixed** — Windows `type` payloads containing `^` were rerouted through
              AutoHotkey's `Send`, making every other metacharacter live: `type a^b!c`
              pressed Alt+C. Typed text now always uses `SendText`.
            - **Fixed** — macOS `press #` (a standalone modifier tap) held Cmd while
              typing `#`.
            - **Changed** — Commands matching no known verb are now **rejected** rather
              than typed into the guest. `type <text>` remains the way to send text;
              `--lenient` restores the old behaviour. A mistyped command previously
              typed itself into whatever had focus and was recorded as a real step.
            - **Added** — `press {code:N}` sends a macOS virtual keycode directly, so a
              key the built-in maps do not cover needs no release.
            - **Added** — `drag … dwell <ms>` and `drag via <x> <y> … to <x> <y>` for
              drag-and-drop targets that need slower or multi-step movement (macOS).
            - **Added** — `{Plus}` names the plus key on all platforms, since a bare `+`
              is always the Shift modifier.

            > ⚠️ Server, agent and CLI must be deployed together, as in v1.1.0.

            ## ✨ Previously in v1.1.0

            Interactive `connect` console upgrades:

            - **Added** — Line editing at the `control-center>` prompt: left/right
              cursor movement and standard readline editing (via a bundled `readline`).
            - **Added** — Command history: recall previous commands with the up/down
              arrows. History **persists across `connect` sessions** and is cleared when
              the **server restarts** (keyed to the server's process-start time). It is
              **encrypted at rest** with a key held in your OS keyring, capped at ~5000
              entries, and survives `clear`. Where no keyring backend is available it
              stays in-memory only for that session.
            - **Fixed** — Left/right arrow keys no longer insert raw escape sequences
              into the prompt.
            - **Changed** — The interactive input path was reworked from a stdin poll to
              a blocking readline reader; agent-disconnect-while-idle detection is
              preserved (an idle session still terminates promptly on disconnect).

            ### 🔒 Security hardening

            Client:
            - Tokens are no longer required on the command line: `token inspect`,
              `token validate`, and `config set-token` now read from a no-echo prompt
              when omitted (argv is visible in the process list / shell history).
            - Local files that can contain command history (`last_session.json`, session/
              metrics exports, token-to-file output) are now written owner-only (0600).
            - Typed text is no longer echoed to stdout/logs during actuation.
            - TLS is on by default; `control-center gen-certs` generates local dev
              material and `CC_TLS_CA` trusts a private CA.

            Server and agent:
            - Transport is TLS-only (`CC_TLS_CERT`/`CC_TLS_KEY`, `AGENT_TLS_CA`).
            - Every RPC enforces a scope: `execute`, `admin` for disconnect, `monitor`
              for the query/watch feed, `agent` for registration and the command stream.
            - Commands are delivered as a structured argv validated against an actuation
              grammar and executed without a shell; the legacy shell-string field is
              rejected outright.
            - The agent command stream is bound to the agent that registered it.

            > ⚠️ **This release is not CLI-only.** The server and agent binaries changed
            > and must be deployed together with the CLI: an old server or agent will not
            > interoperate. Provision the CA, an `agent`-scoped token for the agent, and a
            > `monitor`-scoped token for any monitoring consumer before upgrading.

            ## 📦 What's Included
            
            Each platform package contains:
            - ✅ **control-center-server** (Rust gRPC server)
            - ✅ **control-center-agent** (Rust OS actuation agent)
            - ✅ **generate-token** (Rust JWT token generator)
            - ✅ **control-center CLI** (Python orchestrator)
            - ✅ **install.sh / install.bat** (One-command installer)
            
            ## 🚀 Quick Install
            
            ### Linux / macOS
            ```bash
            # Download and extract
            tar -xzf control-center-*-linux-x64.tar.gz
            cd package
            
            # Install everything
            ./install.sh
            ```
            
            ### Windows
            ```powershell
            # Extract the ZIP file
            # Run install.bat
            ```
            
            ## 📖 Usage
            
            ```bash
            # Generate an auth token
            export JWT_SECRET="your-secret-32-chars-minimum"
            generate-token admin
            generate-token user123 24 execute monitor
            
            # Start server
            control-center server start
            
            # Start agent (on VM/container)
            control-center agent start
            
            # Connect with CLI
            control-center connect --host <server-ip> --token <token>
            
            # Execute single command
            control-center execute -c "960 540 left" --host <server-ip> --token <token>
            
            # Configuration
            control-center config set-token <token>
            control-center config set-server <host> <port>
            control-center config show
            
            # Info
            control-center version
            control-center doctor
            control-center --help
            ```
            
            ## ✨ Features
            
            - ✅ Multi-OS support (Windows, macOS, Linux)
            - ✅ OAuth 2.0 + JWT authentication
            - ✅ Mouse position tracking
            - ✅ Interactive REPL mode
            - ✅ Single command execution
            - ✅ Configuration management
            
