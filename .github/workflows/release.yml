              echo ""
              echo "  Add this to your ~/.bashrc or ~/.zshrc"
          fi
          
          echo "=========================================="
          echo "✓ Installation complete!"
          echo "=========================================="
          echo ""
          echo "Usage:"
          echo "  export JWT_SECRET=\"your-secret-32-chars-minimum\""
          echo "  generate-token admin"
          echo "  control-center server start"
