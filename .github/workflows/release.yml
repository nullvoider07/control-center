# .github/workflows/release.yml
# Control Center - Release Workflow

name: Release Control Center

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: LINUX BUILD (x64)
  # ============================================================================
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Build Rust Binaries
        run: cargo build --release --workspace

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio protobuf pyyaml requests

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile \
            --name control-center \
            --paths crates \
            --add-data "crates/controller;controller" \
            --hidden-import=click \
            --hidden-import=grpc \
            --hidden-import=yaml \
            --hidden-import=google.protobuf \
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        run: |
          mkdir -p package/bin
          
          # Copy BOTH Rust binaries
          cp target/release/control-center-server package/bin/
          cp target/release/control-center-agent package/bin/
          cp dist/control-center package/bin/
          chmod +x package/bin/*
          
          # Create unified installation script
          cat > package/install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "  Control Center v${{ steps.version.outputs.VERSION }}"
          echo "=========================================="
          echo ""
          
          # Install Rust binaries
          echo "[1/2] Installing Rust binaries..."
          mkdir -p "$HOME/.local/bin"
          cp bin/control-center-server "$HOME/.local/bin/"
          cp bin/control-center-agent "$HOME/.local/bin/"
          cp bin/control-center "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/control-center-"*
          echo "  ✓ Server: $HOME/.local/bin/control-center-server"
          echo "  ✓ Agent:  $HOME/.local/bin/control-center-agent"
          echo "  ✓ CLI: $HOME/.local/bin/control-center"
          echo ""
          
          # Check PATH
          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
              echo "⚠ Add to your PATH:"
              echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
              echo ""
              echo "  Add this to your ~/.bashrc or ~/.zshrc"
          fi
          
          echo "=========================================="
          echo "✓ Installation complete!"
          echo "=========================================="
          echo ""
          echo "Usage:"
          echo "  control-center server start    # Start server"
          echo "  control-center agent start     # Start agent"
          echo "  control-center connect --host X --token Y"
          echo "  control-center --help"
          echo ""
          EOF
          chmod +x package/install.sh
          
          # Create tarball
          cd package
          tar -czvf ../control-center-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-assets
          path: control-center-*.tar.gz

  # ============================================================================
  # JOB 2: LINUX BUILD (ARM64)
  # ============================================================================
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Rust Binaries (ARM64)
        run: cross build --release --target aarch64-unknown-linux-gnu --workspace --features openssl-vendored

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio protobuf pyyaml requests

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile \
            --name control-center \
            --paths crates \
            --add-data "crates/controller:controller" \
            --hidden-import=click \
            --hidden-import=grpc \
            --hidden-import=yaml \
            --hidden-import=google.protobuf \
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        run: |
          mkdir -p package/bin
          
          # Copy ARM64 Rust binaries
          cp target/aarch64-unknown-linux-gnu/release/control-center-server package/bin/
          cp target/aarch64-unknown-linux-gnu/release/control-center-agent package/bin/
          cp dist/control-center package/bin/
          chmod +x package/bin/*
          
          # Create installation script (same as x64)
          cat > package/install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "  Control Center v${{ steps.version.outputs.VERSION }} (ARM64)"
          echo "=========================================="
          echo ""
          
          echo "[1/2] Installing Rust binaries..."
          mkdir -p "$HOME/.local/bin"
          cp bin/control-center-server "$HOME/.local/bin/"
          cp bin/control-center-agent "$HOME/.local/bin/"
          cp bin/control-center "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/control-center-"*
          echo "  ✓ Server: $HOME/.local/bin/control-center-server"
          echo "  ✓ Agent:  $HOME/.local/bin/control-center-agent"
          echo "  ✓ CLI: $HOME/.local/bin/control-center"
          echo ""
          
          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
              echo "⚠ Add to your PATH:"
              echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
              echo ""
          fi
          
          echo "=========================================="
          echo "✓ Installation complete!"
          echo "=========================================="
          echo ""
          echo "Usage:"
          echo "  control-center server start"
          echo "  control-center agent start"
          echo "  control-center connect --host X --token Y"
          echo ""
          EOF
          chmod +x package/install.sh
          
          cd package
          tar -czvf ../control-center-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-assets
          path: control-center-*.tar.gz

  # ============================================================================
  # JOB 3: MACOS BUILD (Apple Silicon / ARM64)
  # ============================================================================
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Dependencies
        run: brew install protobuf

      - name: Build Rust Binaries
        run: cargo build --release --workspace

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio protobuf pyyaml requests

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile \
            --name control-center \
            --paths crates \
            --add-data "crates/controller:controller" \
            --hidden-import=click \
            --hidden-import=grpc \
            --hidden-import=yaml \
            --hidden-import=google.protobuf \
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        run: |
          mkdir -p package/bin
          
          cp target/release/control-center-server package/bin/
          cp target/release/control-center-agent package/bin/
          cp dist/control-center package/bin/
          chmod +x package/bin/*
          
          cat > package/install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "  Control Center v${{ steps.version.outputs.VERSION }} (macOS ARM64)"
          echo "=========================================="
          echo ""
          
          echo "[1/2] Installing Rust binaries..."
          mkdir -p "$HOME/.local/bin"
          cp bin/control-center-server "$HOME/.local/bin/"
          cp bin/control-center-agent "$HOME/.local/bin/"
          cp bin/control-center "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/control-center-"*
          
          # Remove quarantine on macOS
          xattr -d com.apple.quarantine "$HOME/.local/bin/control-center-server" 2>/dev/null || true
          xattr -d com.apple.quarantine "$HOME/.local/bin/control-center-agent" 2>/dev/null || true
          
          echo "  ✓ Server: $HOME/.local/bin/control-center-server"
          echo "  ✓ Agent:  $HOME/.local/bin/control-center-agent"
          echo "  ✓ CLI: $HOME/.local/bin/control-center"
          echo ""
          
          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
              echo "⚠ Add to your PATH:"
              echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
              echo ""
          fi
          
          echo "=========================================="
          echo "✓ Installation complete!"
          echo "=========================================="
          EOF
          chmod +x package/install.sh
          
          cd package
          tar -czvf ../control-center-${{ steps.version.outputs.VERSION }}-macos-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-assets
          path: control-center-*.tar.gz
  
  # ============================================================================
  # JOB 4: MACOS BUILD (Intel / x64)
  # ============================================================================
  build-macos-x64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: brew install protobuf

      - name: Build Rust Binaries
        run: cargo build --release --workspace

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio protobuf pyyaml requests

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile \
            --name control-center \
            --paths crates \
            --add-data "crates/controller:controller" \
            --hidden-import=click \
            --hidden-import=grpc \
            --hidden-import=yaml \
            --hidden-import=google.protobuf \
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        run: |
          mkdir -p package/bin
          
          cp target/release/control-center-server package/bin/
          cp target/release/control-center-agent package/bin/
          cp dist/control-center package/bin/
          chmod +x package/bin/*
          
          cat > package/install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "  Control Center v${{ steps.version.outputs.VERSION }} (macOS x64)"
          echo "=========================================="
          echo ""
          
          echo "[1/2] Installing Rust binaries..."
          mkdir -p "$HOME/.local/bin"
          cp bin/control-center-server "$HOME/.local/bin/"
          cp bin/control-center-agent "$HOME/.local/bin/"
          cp bin/control-center "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/control-center-"*
          
          xattr -d com.apple.quarantine "$HOME/.local/bin/control-center-server" 2>/dev/null || true
          xattr -d com.apple.quarantine "$HOME/.local/bin/control-center-agent" 2>/dev/null || true
          
          echo "  ✓ Server: $HOME/.local/bin/control-center-server"
          echo "  ✓ Agent:  $HOME/.local/bin/control-center-agent"
          echo "  ✓ CLI: $HOME/.local/bin/control-center"
          echo ""
          
          echo "=========================================="
          echo "✓ Installation complete!"
          echo "=========================================="
          EOF
          chmod +x package/install.sh
          
          cd package
          tar -czvf ../control-center-${{ steps.version.outputs.VERSION }}-macos-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-assets
          path: control-center-*.tar.gz

  # ============================================================================
  # JOB 5: WINDOWS BUILD (x64)
  # ============================================================================
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Protobuf
        run: choco install protoc

      - name: Build Rust Binaries
        run: cargo build --release --workspace

      - name: Install PyInstaller and dependencies
        run: |
          pip install pyinstaller click grpcio protobuf pyyaml requests

      - name: Build Python CLI Binary
        run: |
          pyinstaller --onefile \
            --name control-center `
            --paths crates `
            --add-data "crates/controller:controller" `
            --hidden-import=click `
            --hidden-import=grpc `
            --hidden-import=yaml `
            --hidden-import=google.protobuf `
            crates/controller/management/cli.py

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\bin
          
          # Copy BOTH Rust binaries
          Copy-Item target\release\control-center-server.exe package\bin\
          Copy-Item target\release\control-center-agent.exe package\bin\
          Copy-Item dist\control-center.exe package\bin\
          
          # Create installation script
          @'
          @echo off
          echo ==========================================
          echo   Control Center v${{ steps.version.outputs.VERSION }} (Windows x64)
          echo ==========================================
          echo.
          
          echo [1/2] Installing Rust binaries...
          if not exist "%LOCALAPPDATA%\Programs\ControlCenter" mkdir "%LOCALAPPDATA%\Programs\ControlCenter"
          copy /Y bin\control-center-server.exe "%LOCALAPPDATA%\Programs\ControlCenter\"
          copy /Y bin\control-center-agent.exe "%LOCALAPPDATA%\Programs\ControlCenter\"
          echo   + Server: %LOCALAPPDATA%\Programs\ControlCenter\control-center-server.exe
          echo   + Agent:  %LOCALAPPDATA%\Programs\ControlCenter\control-center-agent.exe
          echo   + CLI: control-center
          echo.
          
          echo ==========================================
          echo Installation complete!
          echo ==========================================
          echo.
          echo Add to PATH:
          echo   %LOCALAPPDATA%\Programs\ControlCenter
          echo.
          echo Usage:
          echo   control-center server start
          echo   control-center agent start
          echo   control-center connect --host X --token Y
          echo.
          pause
          '@ | Out-File -FilePath package\install.bat -Encoding ASCII
          
          Compress-Archive -Path package\* -DestinationPath control-center-${{ steps.version.outputs.VERSION }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-assets
          path: control-center-*.zip

  # ============================================================================
  # JOB 6: CREATE GITHUB RELEASE
  # ============================================================================
  release:
    needs: 
      - build-linux-x64
      - build-linux-arm64
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Control Center ${{ github.ref_name }}
            
            **Unified package: Rust binaries + Python CLI in one download**
            
            ## 📦 What's Included
            
            Each platform package contains:
            - ✅ **control-center-server** (Rust gRPC server)
            - ✅ **control-center-agent** (Rust OS actuation agent)
            - ✅ **control-center CLI** (Python orchestrator)
            - ✅ **install.sh / install.bat** (One-command installer)
            
            ## 🚀 Quick Install
            
            ### Linux / macOS
            ```bash
            # Download and extract
            tar -xzf control-center-*-linux-x64.tar.gz
            cd package
            
            # Install everything
            ./install.sh
            ```
            
            ### Windows
            ```powershell
            # Extract the ZIP file
            # Run install.bat
            ```
            
            ## 📖 Usage
            
            ```bash
            # Start server
            control-center server start
            
            # Start agent (on VM/container)
            control-center agent start
            
            # Connect with CLI
            control-center connect --host <server-ip> --token <token>
            
            # Execute single command
            control-center execute -c "960 540 left" --host <server-ip> --token <token>
            
            # Configuration
            control-center config set-token <token>
            control-center config set-server <host> <port>
            control-center config show
            
            # Info
            control-center version
            control-center doctor
            control-center --help
            ```
            
            ## ✨ Features
            
            - ✅ Multi-OS support (Windows, macOS, Linux)
            - ✅ OAuth 2.0 + JWT authentication
            - ✅ Mouse position tracking
            - ✅ Interactive REPL mode
            - ✅ Single command execution
            - ✅ Configuration management
            
            ## 📚 Documentation
            
            Full documentation: https://github.com/${{ github.repository }}
            
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}