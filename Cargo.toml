[workspace]
members = ["crates/server", "crates/agent", "crates/auth", "crates/common", "crates/tools"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["Kartik A (NullVoider)"]
license = "GPL-3.0"

[workspace.dependencies]
# Shared dependencies
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
control-center-common = { path = "crates/common" }