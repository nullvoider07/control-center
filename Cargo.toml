[workspace]
members = ["crates/server", "crates/agent", "crates/auth"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["Kartik (NullVoider)"]
license = "GPL-3.0"

[workspace.dependencies]
# Shared dependencies
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"