// proto/control_center.proto
// Protocol Buffer definitions for Control Center
// Token-based authentication only

syntax = "proto3";

package control_center;

// ============================================================================
// Service Definitions
// ============================================================================

/// Control Service - Main API for CLI clients
///
/// All methods require JWT token authentication via gRPC metadata.
/// Token should be passed as: metadata[('authorization', 'Bearer <token>')]
service ControlService {
  // Get information about the connected agent
  //
  // Requires: Valid JWT token in metadata
  // Returns: OS type, version, and available capabilities
  rpc GetAgentInfo(AgentInfoRequest) returns (AgentInfo);
  
  // Execute a single command on the agent
  //
  // Requires: Valid JWT token in metadata
  // Rate limited to 100 requests per minute per user
  rpc ExecuteCommand(CommandRequest) returns (CommandResponse);
  
  // Execute multiple commands via bidirectional streaming
  //
  // Requires: Valid JWT token in metadata
  // Responses are returned in the same order as requests
  rpc ExecuteCommandStream(stream CommandRequest) returns (stream CommandResponse);
  
  // Monitor connection status to the agent
  //
  // Requires: Valid JWT token in metadata
  // Updates sent every 5 seconds
  rpc MonitorConnection(MonitorRequest) returns (stream ConnectionStatus);
}

/// Agent Service - Internal API for server-to-agent communication
///
/// This service runs on the agent (inside container) and is only
/// accessible from localhost. It trusts the server's validation.
service AgentService {
  // Get agent information (OS, version, capabilities)
  rpc GetInfo(InfoRequest) returns (AgentInfo);
  
  // Execute a command on the local system
  //
  // Commands are executed based on OS type:
  // - Windows: Write to C:\mouse_cmd.txt or C:\keyboard_cmd.txt
  // - macOS: Execute via cliclick
  // - Linux: Execute via xdotool
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  
  // Health check ping
  rpc Ping(PingRequest) returns (PongResponse);
}

// ============================================================================
// Message Definitions - Agent Information
// ============================================================================

/// Request for agent information
/// 
/// Note: Authentication via JWT token in gRPC metadata
/// No fields needed in request body
message AgentInfoRequest {
  // Empty - authentication handled via metadata
}

/// Operating system type enumeration
enum OSType {
  /// Windows (any version)
  WINDOWS = 0;
  
  /// macOS (any version)
  MACOS = 1;
  
  /// Linux (any distribution)
  LINUX = 2;
}

/// Information about the agent
message AgentInfo {
  /// Operating system type
  OSType os = 1;
  
  /// OS version string
  /// Examples:
  /// - "Windows 11 22H2 (Build 22621)"
  /// - "macOS 14.2 (Build 23C64)"
  /// - "Ubuntu 22.04.3 LTS"
  string os_version = 2;
  
  /// List of available capabilities
  /// Examples: ["mouse", "keyboard", "cliclick", "xdotool"]
  repeated string capabilities = 3;
  
  /// Agent version (semver)
  /// Example: "1.0.0"
  string agent_version = 4;
}

// ============================================================================
// Message Definitions - Command Execution
// ============================================================================

/// Request to execute a command
///
/// Note: Authentication via JWT token in gRPC metadata
message CommandRequest {
  /// Unique request identifier (UUID v4)
  /// Used for tracking and logging
  string id = 1;
  
  /// Command to execute (OS-specific format)
  ///
  /// Windows examples:
  ///   - "960 540 left"  (mouse click)
  ///   - "type Hello"    (keyboard input)
  ///
  /// macOS examples:
  ///   - "cliclick c:960,540"  (mouse click)
  ///   - "cliclick t:Hello"    (keyboard input)
  ///
  /// Linux examples:
  ///   - "xdotool mousemove 960 540 click 1"  (mouse click)
  ///   - "xdotool type Hello"                  (keyboard input)
  ///
  /// Maximum length: 10,000 characters
  string command = 2;
}

/// Response from command execution
message CommandResponse {
  /// Request ID from the original CommandRequest
  string id = 1;
  
  /// Whether execution succeeded
  bool success = 2;
  
  /// Result message or error description
  /// Examples:
  /// - "Left-clicked at (960, 540)"
  /// - "Right-clicked here at (1024, 768)"
  /// - "Double-clicked at (500, 300)"
  /// - "Execution failed: cliclick not found"
  string message = 3;
  
  /// Execution time in milliseconds
  /// Measured from request receipt to response send
  int64 execution_time_ms = 4;
  
  // ============================================================================
  // ✅ NEW: Mouse Position Tracking Fields
  // ============================================================================
  
  /// X coordinate where mouse action was performed
  /// Only populated for mouse commands, null for keyboard commands
  optional int32 mouse_x = 5;
  
  /// Y coordinate where mouse action was performed
  /// Only populated for mouse commands, null for keyboard commands
  optional int32 mouse_y = 6;
  
  /// Whether position was successfully captured
  /// true: position is valid, false: position capture failed or not applicable
  optional bool position_captured = 7;
}

// ============================================================================
// Message Definitions - Connection Monitoring
// ============================================================================

/// Request to monitor connection status
///
/// Note: Authentication via JWT token in gRPC metadata
message MonitorRequest {
  // Empty - authentication handled via metadata
}

/// Connection status update
message ConnectionStatus {
  /// Whether agent is currently connected
  bool connected = 1;
  
  /// Human-readable status message
  /// Examples:
  /// - "Connected to agent"
  /// - "Disconnected from agent"
  /// - "Agent unreachable"
  string message = 2;
  
  /// Unix timestamp of this status update
  int64 timestamp = 3;
}

// ============================================================================
// Message Definitions - Agent Service (Internal)
// ============================================================================

/// Request for agent info (internal)
message InfoRequest {
  // No fields - agent returns its own info
}

/// Request to execute command on agent (internal)
message ExecuteRequest {
  /// Request identifier
  string id = 1;
  
  /// Command to execute (already OS-specific format from server)
  string command = 2;
  
  /// User ID from JWT token (for logging/auditing)
  optional string user_id = 3;
}

/// Response from agent command execution (internal)
message ExecuteResponse {
  /// Request ID
  string id = 1;
  
  /// Success status
  bool success = 2;
  
  /// Result or error message
  /// Examples:
  /// - "Left-clicked at (960, 540)"
  /// - "Right-clicked here at (1024, 768)"
  /// - "Double-clicked at (500, 300)"
  /// - "Typed 'Hello World'"
  string message = 3;
  
  /// Execution time in milliseconds
  int64 execution_time_ms = 4;
  
  // ============================================================================
  // ✅ NEW: Mouse Position Tracking Fields
  // ============================================================================
  
  /// X coordinate where mouse action was performed
  /// Only populated for mouse commands, null for keyboard commands
  optional int32 mouse_x = 5;
  
  /// Y coordinate where mouse action was performed
  /// Only populated for mouse commands, null for keyboard commands
  optional int32 mouse_y = 6;
  
  /// Whether position was successfully captured
  /// true: position is valid, false: position capture failed or not applicable
  optional bool position_captured = 7;
}

/// Ping request for health check
message PingRequest {
  // No fields
}

/// Pong response for health check
message PongResponse {
  /// Whether agent is alive
  bool alive = 1;
}

// ============================================================================
// Authentication & Authorization Notes
// ============================================================================
//
// AUTHENTICATION:
// - All ControlService RPCs require JWT token in gRPC metadata
// - Token passed as: metadata[('authorization', 'Bearer <token>')]
// - Server validates JWT signature and expiration
//
// AUTHORIZATION:
// - Server extracts user_id and scopes from JWT claims
// - Rate limiting applied per user_id
// - Scopes can be checked for fine-grained permissions
//
// TOKEN FORMAT (JWT):
// {
//   "sub": "user_id",           // Subject (user identifier)
//   "exp": 1234567890,          // Expiration timestamp
//   "iat": 1234567890,          // Issued at timestamp
//   "scopes": ["control"],      // Permissions
//   "aud": "control-center",    // Audience
//   "iss": "your-auth-server"   // Issuer
// }
//
// FLOW:
// 1. CLI obtains JWT token (from config/env/flag)
// 2. CLI connects to ControlService with token in metadata
// 3. Server validates token and extracts claims
// 4. Server forwards command to Agent (agent trusts server)
// 5. Agent executes and returns result
//
// ============================================================================
// Security Considerations
// ============================================================================
//
// 1. Agent Service should only listen on 127.0.0.1 (localhost)
// 2. Control Service should require JWT authentication on all RPCs
// 3. Use TLS (add SSL certificates to channel)
// 4. Implement rate limiting to prevent abuse
// 5. Log all command executions with user_id for auditing
// 6. Validate and sanitize all command inputs
// 7. Token should have reasonable expiration (e.g., 24 hours)
// 8. Support token refresh mechanism
//
// ============================================================================
// Performance Considerations
// ============================================================================
//
// 1. Use streaming for batch operations (>10 commands)
// 2. Keep alive connections with periodic ping
// 3. Cache agent info after first request
// 4. Use connection pooling for multiple clients
// 5. Set appropriate timeouts (default: 30s)
//
// ============================================================================
// Position Tracking Implementation Notes
// ============================================================================
//
// POSITION CAPTURE:
// - Captured by agent AFTER command execution
// - Linux: xdotool getmouselocation
// - Windows: PowerShell System.Windows.Forms.Cursor
// - macOS: cliclick p:.
//
// MESSAGE FORMAT EXAMPLES:
// - "Left-clicked at (960, 540)" - coordinate-based click
// - "Right-clicked here at (1024, 768)" - here command with position
// - "Double-clicked at (500, 300)" - double click
// - "Dragged from (100, 100) to (500, 500)" - drag operation
// - "Typed 'Hello'" - keyboard action (no position)
//
// ============================================================================